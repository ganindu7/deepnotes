# ~/.tmux.conf — managed by ~/Workspace/dotfiles
# Works on tmux 2.4+ so the same file can go on remote Linux boxes.
# Prefix is Ctrl+f (see Keys). Caps Lock is Ctrl via Karabiner on the Mac, so
# Caps Lock + f is a home-row chord; the default Ctrl+b is a bottom-row reach.

# ---- General ----------------------------------------------------------------
set -g history-limit 102400     # scrollback lines per pane (default 2000)
set -g base-index 1             # windows numbered from 1, matching the key row
setw -g pane-base-index 1       # panes too, for consistency
set -g renumber-windows on      # close gaps when a window is killed
set -sg escape-time 10          # Esc reaches vim instantly instead of after 500 ms

# ---- Keys -------------------------------------------------------------------
# Prefix: Ctrl+f. Costs Ctrl+f page-forward in vim/less (press it twice to pass
# it through) and readline forward-char, which Right arrow also does.
set -g prefix C-f
unbind C-b
bind C-f send-prefix
set -g status-keys emacs        # emacs-style editing on the prefix + : prompt
setw -g mode-keys vi            # vi keys in copy mode (prefix + [ to enter)
# vi-style select / yank in copy mode; without these it is Space / Enter
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- Pane resizing ----------------------------------------------------------
# tmux's defaults are prefix + Ctrl+Arrow / Option+Arrow. On macOS, Ctrl+Arrow
# is grabbed by Mission Control ("Move left/right a space") before the terminal
# sees it, and that applies over ssh too since the Mac is doing the grabbing.
# Vim-style keys avoid it. -r = repeatable: press prefix once, then keep
# tapping the key within repeat-time (500 ms).
# Note: this overrides the default prefix + L (switch to last session).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Pane movement ----------------------------------------------------------
# Vim-style h/j/k/l to move between panes (defaults are prefix + Arrow).
# Deliberately not -r: with repeat on, a letter typed within 500 ms of a move
# would be swallowed as another move instead of reaching the shell.
# Note: this overrides the default prefix + l (switch to last window).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Mouse ------------------------------------------------------------------
# Click to select panes, drag borders to resize, scroll to enter copy mode.
# In iTerm2 hold Option while dragging to select text with the terminal instead.
set -g mouse on
